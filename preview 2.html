<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lawyer Rezan Azad Saeed</title>
<style>
:root{--gold:#d4af37;--gold2:#f3d77a;--gold3:#9a7b1c;--bg:#0b0b0b;--card:#151515;--line:rgba(212,175,55,.25);--text:#f4efe0;--muted:#a79f88}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#2a2209 0,var(--bg) 55%) fixed;color:var(--text);min-height:100vh;padding-bottom:96px}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px}
.lang{display:flex;justify-content:center;gap:6px;margin-bottom:22px}
.lang button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:20px;font:inherit;font-size:13px;cursor:pointer;transition:.25s}
.lang button.on{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#111;border-color:transparent;font-weight:700}
.hero{text-align:center;animation:up .7s both}
.avatar{position:relative;width:160px;height:160px;margin:0 auto 16px}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--gold2),var(--gold3),#fff3b8,var(--gold),var(--gold2));animation:spin 8s linear infinite}
.avatar img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);border-radius:50%;object-fit:cover;border:4px solid var(--bg);background:#222}
.badge{position:absolute;bottom:6px;inset-inline-end:6px;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold3));display:grid;place-items:center;border:3px solid var(--bg);box-shadow:0 4px 12px rgba(0,0,0,.5);animation:pulse 2.4s infinite}
.badge svg{width:22px;height:22px;fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:24px;color:var(--gold2);margin-bottom:4px}
.job{color:var(--gold);font-size:15px;letter-spacing:.5px;margin-bottom:12px}
.bio{color:var(--muted);font-size:14.5px;line-height:1.9;max-width:380px;margin:0 auto}
.links{display:grid;gap:10px;margin:24px 0;animation:up .7s .15s both}
.btn{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);text-decoration:none;font-size:15px;transition:.25s}
.btn:active,.btn:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 6px 18px rgba(212,175,55,.15)}
.btn .ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold3));display:grid;place-items:center;flex:none}
.btn .ic svg{width:20px;height:20px;fill:#111}
.btn span.t{flex:1}
.btn .ar{color:var(--gold);font-size:18px}
[dir=rtl] .btn .ar{transform:scaleX(-1)}
h2{font-size:17px;color:var(--gold);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
[dir=rtl] h2::after{background:linear-gradient(270deg,var(--line),transparent)}
.addr{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.7}
.addr svg{width:24px;height:24px;fill:var(--gold);flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;font-size:14px;transition:.25s;opacity:0;animation:up .6s forwards}
.card:hover{border-color:var(--gold);transform:translateY(-3px)}
.card .e{font-size:26px;display:block;margin-bottom:8px}
.skills{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--gold3);color:var(--gold2);font-size:13.5px;background:rgba(212,175,55,.06);opacity:0;animation:up .6s forwards}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
.cta{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#0b0b0b 60%,transparent);z-index:10}
.cta a{display:flex;align-items:center;justify-content:center;gap:10px;max-width:480px;margin:0 auto;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#111;font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 8px 24px rgba(212,175,55,.35);animation:glow 2.5s infinite}
.cta svg{width:22px;height:22px;fill:#111}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes glow{50%{box-shadow:0 8px 32px rgba(212,175,55,.6)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang" id="lang"></div>
  <div class="hero">
    <div class="avatar">
      <div class="ring"></div>
      <img id="photo" alt="">
      <div class="badge"><svg viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M5 7h14"/><path d="M5 7l-3 7a3 3 0 0 0 6 0L5 7zM19 7l-3 7a3 3 0 0 0 6 0l-3-7z"/></svg></div>
    </div>
    <h1 id="name"></h1>
    <div class="job" id="job"></div>
    <p class="bio" id="bio"></p>
  </div>
  <div class="links" id="links"></div>
  <h2 id="hAddr"></h2>
  <div class="addr"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg><span id="addr"></span></div>
  <h2 id="hWork"></h2>
  <div class="grid" id="work"></div>
  <h2 id="hSkills"></h2>
  <div class="skills" id="skills"></div>
  <footer id="foot"></footer>
</div>
<div class="cta"><a id="cta" href="#"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.200-1.400A10 10 0 1 0 12 2zm5.200 14c-.2.600-1.300 1.200-1.800 1.200-.5.100-1 .2-3.300-.7-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .5l-.4.600c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.400.3.100.5.100.6-.1l.9-1.100c.2-.2.400-.2.600-.1l2 .9c.3.200.5.200.5.400.1.100.1.700-.1 1.300z"/></svg><span id="ctaT"></span></a></div>

<script>
const CONFIG = {
  defaultLang: "ku",
  photo: "https://i.postimg.cc/gj6jG6Pj/IMG-8029.jpg",
  whatsappNumber: "07503235971",          // دەبیتە wa.me/9647503235971
  countryCode: "964",
  instagram: "https://www.instagram.com/parezer.rezan.simo?mdxt=NzZkNWFrc25kcGhy",
  facebook: "https://www.facebook.com/share/19L7ZoLRyW/?mibextid=wwXIfr",
  snapchat: "https://www.snapchat.com/add/username", // نمونە - بگۆڕە
  i18n: {
    ku: {
      dir: "rtl", label: "کوردی",
      name: "پارێزەر رێزان ئازاد سەعید",
      job: "پارێزەر و راوێژکارێ یاسایی",
      bio: "ب شارەزایی و دڵسۆزی، پشتەڤانێ مافێن تەیە. راوێژکاری و بەرگریکرن د هەمی بوارێن یاسایی دا.",
      wa: "واتسئاپ", ig: "ئینستاگرام", sn: "سناپ", fb: "فەیسبووك",
      hAddr: "ناڤنیشان", addr: "دهۆک، عێراق - نڤیسگەهێ پارێزەری (نمونە)",
      hWork: "بوارێن کاری", hSkills: "شیان و شارەزایی",
      work: [["⚖️","دادگەهێن مەدەنی"],["🛡️","دادگەهێن تاوانی"],["👨‍👩‍👧","کێشێن خێزانی"],["📜","گرێبەست و تۆمارکرن"]],
      skills: ["راوێژکاری یاسایی","نڤیسینا گرێبەستان","بەرگریکرن د دادگەهێ دا","چارەسەریا ناکۆکیان","پەیڤینا ب هێمنی"],
      cta: "پەیوەندی ل گەل مە بکە", foot: "هەمی مافان پارێزراون"
    },
    ar: {
      dir: "rtl", label: "عربي",
      name: "المحامي ريزان ئازاد سعيد",
      job: "محامٍ ومستشار قانوني",
      bio: "بخبرة وإخلاص أدافع عن حقوقك. استشارات قانونية وترافع في مختلف المجالات القانونية.",
      wa: "واتساب", ig: "انستغرام", sn: "سناب شات", fb: "فيسبوك",
      hAddr: "العنوان", addr: "دهوك، العراق - مكتب المحاماة (مثال)",
      hWork: "مجالات العمل", hSkills: "المهارات والخبرات",
      work: [["⚖️","القضايا المدنية"],["🛡️","القضايا الجزائية"],["👨‍👩‍👧","قضايا الأسرة"],["📜","العقود والتوثيق"]],
      skills: ["استشارات قانونية","صياغة العقود","الترافع أمام المحاكم","تسوية النزاعات","التفاوض"],
      cta: "تواصل معنا", foot: "جميع الحقوق محفوظة"
    },
    en: {
      dir: "ltr", label: "EN",
      name: "Lawyer Rezan Azad Saeed",
      job: "Attorney & Legal Consultant",
      bio: "With expertise and dedication, I stand by your rights. Legal consulting and court representation across all areas of law.",
      wa: "WhatsApp", ig: "Instagram", sn: "Snapchat", fb: "Facebook",
      hAddr: "Address", addr: "Duhok, Iraq - Law Office (sample)",
      hWork: "Practice Areas", hSkills: "Skills & Expertise",
      work: [["⚖️","Civil Cases"],["🛡️","Criminal Cases"],["👨‍👩‍👧","Family Matters"],["📜","Contracts & Notary"]],
      skills: ["Legal Consulting","Contract Drafting","Court Representation","Dispute Resolution","Negotiation"],
      cta: "Contact Us", foot: "All rights reserved"
    }
  }
};

const $ = id => document.getElementById(id);
let local = CONFIG.whatsappNumber.replace(/\D/g,"").replace(/^0+/,"");
const waLink = "https://wa.me/" + CONFIG.countryCode + local;
const ICONS = {
  wa:'<path d="M12 2a10 10 0 0 0-8.600 15L2 22l5.200-1.400A10 10 0 1 0 12 2zm5.200 14c-.2.600-1.300 1.200-1.800 1.200-.5.100-1 .2-3.300-.7-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .5l-.4.600c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.400.3.100.5.100.6-.1l.9-1.100c.2-.2.400-.2.600-.1l2 .9c.3.200.5.200.5.400.1.100.1.700-.1 1.300z"/>',
  ig:'<path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5.500A4.500 4.500 0 1 0 12 16.500 4.500 4.500 0 0 0 12 7.500zm0 2A2.500 2.500 0 1 1 12 14.500 2.500 2.500 0 0 1 12 9.500zM17.500 5.500a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>',
  sn:'<path d="M12 2c3 0 5 2 5 5v2.500c.4.200 1 .3 1.600.3.500 0 .900.400.900.800 0 .700-1.200 1-2 1.300-.3.100-.4.400-.2.700.9 1.600 2 2.300 3 2.700.4.200.4.700 0 .900-.700.300-1.600.4-2 .500-.2.300-.1 1-.6 1.100-.600 0-1.300-.3-2.300 0-1.200.4-1.800 1.700-3.400 1.700s-2.200-1.300-3.400-1.700c-1-.3-1.700 0-2.300 0-.5-.1-.4-.8-.6-1.100-.4-.1-1.300-.2-2-.5-.4-.2-.4-.7 0-.9 1-.4 2.100-1.100 3-2.700.2-.3.100-.6-.2-.7-.8-.3-2-.6-2-1.300 0-.4.400-.8.900-.8.600 0 1.200-.1 1.600-.3V7c0-3 2-5 5-5z"/>',
  fb:'<path d="M14 8V6c0-.8.200-1.200 1.300-1.200H17V2h-2.500C11.500 2 10 3.700 10 6v2H8v3h2v11h4V11h2.600l.4-3h-3z"/>'
};

function link(href,key,t){
  return `<a class="btn" href="${href}" target="_blank" rel="noopener"><span class="ic"><svg viewBox="0 0 24 24">${ICONS[key]}</svg></span><span class="t">${t}</span><span class="ar">›</span></a>`;
}

function render(lang){
  const t = CONFIG.i18n[lang];
  document.documentElement.lang = lang === "ku" ? "ku" : lang;
  document.documentElement.dir = t.dir;
  document.title = t.name;
  $("photo").src = CONFIG.photo; $("photo").alt = t.name;
  $("name").textContent = t.name; $("job").textContent = t.job; $("bio").textContent = t.bio;
  $("links").innerHTML =
    link(waLink,"wa",t.wa) + link(CONFIG.instagram,"ig",t.ig) +
    link(CONFIG.snapchat,"sn",t.sn) + link(CONFIG.facebook,"fb",t.fb);
  $("hAddr").textContent = t.hAddr; $("addr").textContent = t.addr;
  $("hWork").textContent = t.hWork; $("hSkills").textContent = t.hSkills;
  $("work").innerHTML = t.work.map((w,i)=>`<div class="card" style="animation-delay:${.2+i*.1}s"><span class="e">${w[0]}</span>${w[1]}</div>`).join("");
  $("skills").innerHTML = t.skills.map((s,i)=>`<span class="chip" style="animation-delay:${.3+i*.08}s">${s}</span>`).join("");
  $("cta").href = waLink; $("cta").target = "_blank"; $("ctaT").textContent = t.cta;
  $("foot").textContent = "© " + new Date().getFullYear() + " " + t.name + " — " + t.foot;
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  try{ localStorage.setItem("lang", lang); }catch(e){}
}

$("lang").innerHTML = Object.keys(CONFIG.i18n).map(k=>`<button data-l="${k}">${CONFIG.i18n[k].label}</button>`).join("");
$("lang").addEventListener("click", e => { const l = e.target.dataset.l; if(l) render(l); });
let start = CONFIG.defaultLang;
render(start);
</script>
</body>
</html>
